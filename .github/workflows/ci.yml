name: CI - Build, Test & Code Analysis

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ─── Java (Maven) ──────────────────────────────────────────────
  java-build-and-test:
    name: Java - Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & run tests
        run: mvn -B clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: target/surefire-reports/

  java-code-analysis:
    name: Java - Code Analysis
    runs-on: ubuntu-latest
    needs: java-build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run SpotBugs analysis
        run: |
          mvn -B clean compile
          mvn -B com.github.spotbugs:spotbugs-maven-plugin:4.8.3.1:check || true

      - name: Run Checkstyle
        run: |
          mvn -B checkstyle:check \
            -Dcheckstyle.config.location=sun_checks.xml \
            -Dcheckstyle.violationSeverity=warning || true

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-analysis-reports
          path: |
            target/spotbugsXml.xml
            target/checkstyle-result.xml

  # ─── .NET (C#) ─────────────────────────────────────────────────
  dotnet-build-and-test:
    name: .NET - Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/main/dotnet/DotNetAnalyzer/DotNetAnalyzer.csproj

      - name: Build
        run: dotnet build src/main/dotnet/DotNetAnalyzer/DotNetAnalyzer.csproj --no-restore -c Release

      - name: Restore test dependencies
        run: dotnet restore src/test/dotnet/DotNetAnalyzer.Tests/DotNetAnalyzer.Tests.csproj

      - name: Run tests
        run: |
          dotnet test src/test/dotnet/DotNetAnalyzer.Tests/DotNetAnalyzer.Tests.csproj \
            --no-restore \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./dotnet-test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: dotnet-test-results/

  dotnet-code-analysis:
    name: .NET - Code Analysis
    runs-on: ubuntu-latest
    needs: dotnet-build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install analysis tools
        run: |
          dotnet tool install --global dotnet-format || true
          dotnet tool install --global security-scan || true

      - name: Run dotnet format check
        run: |
          dotnet format src/main/dotnet/DotNetAnalyzer/DotNetAnalyzer.csproj \
            --verify-no-changes --verbosity diagnostic || true

      - name: Run security scan
        run: |
          security-scan src/main/dotnet/DotNetAnalyzer/DotNetAnalyzer.csproj \
            --export=dotnet-security-report.sarif || true

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-analysis-reports
          path: dotnet-security-report.sarif

  # ─── Release distribution (tag-triggered) ──────────────────────
  release:
    name: Build & Publish Distribution
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [java-build-and-test, dotnet-build-and-test]
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Java fat jar
        run: mvn -B -DskipTests clean package

      - name: Publish .NET analyzer
        run: |
          dotnet publish src/main/dotnet/DotNetAnalyzer/DotNetAnalyzer.csproj \
            -c Release \
            -o dist/dotnet-analyzer

      - name: Stage distribution
        run: |
          mkdir -p dist/static-inference-${VERSION}/java
          mkdir -p dist/static-inference-${VERSION}/dotnet
          cp target/java-dependency-extractor.jar dist/static-inference-${VERSION}/java/
          cp -r dist/dotnet-analyzer/. dist/static-inference-${VERSION}/dotnet/
          cp run-extractor.sh dist/static-inference-${VERSION}/ 2>/dev/null || true
          cp README.md CONFIGURATION.md ALGORITHMS.md dist/static-inference-${VERSION}/ 2>/dev/null || true

      - name: Create archives
        working-directory: dist
        run: |
          tar -czf static-inference-${VERSION}.tar.gz static-inference-${VERSION}
          zip -r static-inference-${VERSION}.zip static-inference-${VERSION}
          sha256sum static-inference-${VERSION}.tar.gz static-inference-${VERSION}.zip > checksums.sha256

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-inference-${{ env.VERSION }}
          path: |
            dist/static-inference-${{ env.VERSION }}.tar.gz
            dist/static-inference-${{ env.VERSION }}.zip
            dist/checksums.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/static-inference-${{ env.VERSION }}.tar.gz
            dist/static-inference-${{ env.VERSION }}.zip
            dist/checksums.sha256
          generate_release_notes: true
